name: Delivery

# Reusable delivery automation. A repository adopts it with the thin caller in templates/delivery-caller.yml.
# Security: callers run on pull_request_target, so only this repository's reviewed scripts execute with
# credentials; pull-request content is read as data and never installed or run.
on:
  workflow_call:
    inputs:
      pr:
        description: Implementation PR number for a manual reconcile
        type: string
        required: false
      dry_run:
        description: Report the candidate classification without pushing
        type: boolean
        default: true
      tools_ref:
        description: Ref of timurproko/MyWorkflows whose scripts run; keep equal to the ref in the caller's uses line
        type: string
        default: main
    secrets:
      app_id:
        description: App id of the delivery bot installed on the calling repository
        required: true
      app_private_key:
        description: Private key of the delivery bot
        required: true

permissions:
  contents: read

env:
  DELIVERY_BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  finalize:
    name: Promote or finalize the delivery
    # Rationale: GitHub gives a Dependabot pull request no Actions secrets, so the bot identity cannot be minted for
    # it. Such a pull request opens ready and links no change: there is nothing to promote or finalize.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target' && github.event.action != 'closed'
      && github.event.action != 'labeled' && github.event.action != 'unlabeled'
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: delivery-finalization-${{ inputs.pr || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      REQUESTED_PR: ${{ inputs.pr || github.event.pull_request.number }}
      FINALIZATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned trusted tooling without hooks
        run: npm ci --ignore-scripts --omit=dev

      - name: Promote or finalize the candidate with the App identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_BOT_APP_ID: ${{ secrets.app_id }}
          DELIVERY_BOT_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          set -euo pipefail
          args=(--pr "$REQUESTED_PR")
          if [ "$FINALIZATION_DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          node scripts/publish-openspec-finalization.mjs "${args[@]}"

  check:
    # A repository requires this check next to its own tests. Drafts emit none: a draft cannot merge.
    name: Delivery check
    if: >-
      github.event_name == 'pull_request_target' && github.event.action != 'closed'
      && github.event.action != 'labeled' && github.event.action != 'unlabeled'
      && github.event.pull_request.draft == false
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: delivery-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Decide whether this exact head is deliverable
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_PR_NUMBER: ${{ github.event.pull_request.number }}
          DELIVERY_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/delivery-check.mjs

  refresh:
    name: Refresh stale ready pull requests
    # Rationale: a merge made with GITHUB_TOKEN emits no pull-request event, so a caller may also
    # forward the completion of such a merging workflow through workflow_run.
    if: >-
      github.event_name == 'workflow_run'
      || (github.event_name == 'pull_request_target' && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: delivery-ready-refresh
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint the event-producing App identity for branch updates
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Refresh every stale ready pull request against the current target
        env:
          BRANCH_REFRESH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/refresh-ready-pull-requests.mjs

  branch-cleanup:
    name: Delete the merged topic branch
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed'
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: delivery-branch-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Reconcile the exact merged head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-merged-branch.mjs

  label-sync:
    name: Sync the base labels
    # Assignment-only events do not change definitions and must not restart delivery checks.
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'pull_request')
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
    # Read-only manual diffs use github.token, including for private repository labels.
    permissions:
      contents: read
      pull-requests: read
    # Advisory and default-on unless explicitly opted out; never a delivery prerequisite.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: delivery-label-sync
      # False alone still replaces an existing pending job in GitHub's default single-slot queue.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint a separate label App token unless opted out or read-only
        id: labels-app
        if: vars.DELIVERY_LABELS_ENABLED != 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-pull-requests: write

      - name: Reconcile definitions or report explicit opt-out
        env:
          GH_TOKEN: ${{ steps.labels-app.outputs.token || github.token }}
          LABELS_APP_TOKEN: ${{ steps.labels-app.outputs.token }}
          DELIVERY_LABELS_ENABLED: ${{ vars.DELIVERY_LABELS_ENABLED }}
          LABELS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/run-label-automation.mjs

  review-label-reconciliation:
    name: Keep only the latest managed review label
    # Only assignment additions run this advisory job; all code-delivery jobs skip them.
    # Editable current/historical managed names are resolved in trusted tooling, not YAML.
    if: >-
      (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
      && github.event.action == 'labeled' && github.event.pull_request.state == 'open'
      && github.event.pull_request.merged != true
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: delivery-review-label-reconciliation-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint a separate reconciliation App token unless opted out
        id: review-labels-app
        if: vars.DELIVERY_LABELS_ENABLED != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-pull-requests: write

      - name: Reconcile managed additions or report opt-out
        env:
          GH_TOKEN: ${{ steps.review-labels-app.outputs.token }}
          LABELS_APP_TOKEN: ${{ steps.review-labels-app.outputs.token }}
          DELIVERY_LABELS_ENABLED: ${{ vars.DELIVERY_LABELS_ENABLED }}
          LABELS_OPERATION: reconcile
        run: node scripts/run-label-automation.mjs

  review-label-cleanup:
    name: Clear the closed pull request's managed review labels
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    # This advisory fallback must never fail promotion/finalization or become a required merge gate.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: delivery-review-label-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint a separate cleanup App token unless opted out
        id: cleanup-app
        if: vars.DELIVERY_LABELS_ENABLED != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-pull-requests: write

      - name: Clear all current and historical managed review names or report opt-out
        env:
          GH_TOKEN: ${{ steps.cleanup-app.outputs.token }}
          LABELS_APP_TOKEN: ${{ steps.cleanup-app.outputs.token }}
          DELIVERY_LABELS_ENABLED: ${{ vars.DELIVERY_LABELS_ENABLED }}
          LABELS_OPERATION: cleanup
        run: node scripts/run-label-automation.mjs
