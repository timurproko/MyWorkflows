name: Delivery (this repository)

# This repository delivers its own changes through the workflow it shares. The file is templates/delivery-caller.yml
# with a local `uses` line: on pull_request_target that resolves to the reusable workflow on main, never to the
# pull request's copy, so a change to the delivery scripts is exercised here by the first pull request after it merges.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, converted_to_draft, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Implementation PR number to reconcile
        type: string
        required: true
      approved_head:
        description: Full SHA approved by a reviewer or person; required to promote a draft
        type: string
        required: false
      dry_run:
        description: Report the candidate classification without pushing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  delivery:
    uses: ./.github/workflows/delivery.yml
    with:
      pr: ${{ inputs.pr }}
      approved_head: ${{ inputs.approved_head }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      app_id: ${{ vars.DELIVERY_BOT_APP_ID }}
      app_private_key: ${{ secrets.DELIVERY_BOT_PRIVATE_KEY }}
