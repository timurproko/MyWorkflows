name: Reference labels

# Only this repository's managed label identities can update the published palette.
on:
  label:
    types: [edited, created, deleted]
  workflow_dispatch:
    inputs:
      apply:
        description: Publish a validated reference reconciliation pull request (never write labels)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: delivery-reference-labels
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'timurproko/MyWorkflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mint a repository-scoped publication token only for publication
        id: app
        if: github.event_name == 'label' || inputs.apply
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DELIVERY_BOT_APP_ID }}
          private-key: ${{ secrets.DELIVERY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Reconcile managed reference metadata through a pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REFERENCE_APP_TOKEN: ${{ steps.app.outputs.token }}
          REFERENCE_APPLY: ${{ github.event_name == 'label' || inputs.apply }}
        run: node scripts/reference-labels.mjs
