name: Managed review labels

# Label-only reusable workflow: never add delivery/test jobs or their check names here.
# A skipped required job also satisfies GitHub protection; job-level guards are not isolation.
on:
  workflow_call:
    inputs:
      tools_ref:
        description: Ref of timurproko/MyWorkflows tooling; keep equal to the caller's uses ref
        type: string
        default: main
    secrets:
      app_id:
        description: App id of the delivery bot installed on the calling repository
        required: true
      app_private_key:
        description: Private key of the delivery bot
        required: true

permissions:
  contents: read

jobs:
  review-label-reconciliation:
    name: Reconcile managed review labels (advisory)
    # Editable current/historical managed names are resolved in trusted tooling, not YAML.
    if: >-
      (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
      && github.event.action == 'labeled' && github.event.pull_request.state == 'open'
      && github.event.pull_request.merged != true
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: delivery-review-label-reconciliation-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timurproko/MyWorkflows
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mint a separate reconciliation App token unless opted out
        id: review-labels-app
        if: vars.DELIVERY_LABELS_ENABLED != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-pull-requests: write

      - name: Reconcile managed additions or report opt-out
        env:
          GH_TOKEN: ${{ steps.review-labels-app.outputs.token }}
          LABELS_APP_TOKEN: ${{ steps.review-labels-app.outputs.token }}
          DELIVERY_LABELS_ENABLED: ${{ vars.DELIVERY_LABELS_ENABLED }}
          LABELS_OPERATION: reconcile
        run: node scripts/run-label-automation.mjs
