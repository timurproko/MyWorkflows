# Opens a pull request here when a newer OpenSpec, or another dependency, is published. This repository holds the one
# OpenSpec version every adopting repository and the delivery bot use, so merging that pull request updates them all.
version: 2
updates:
  - package-ecosystem: npm
    labels: []
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    labels: []
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
