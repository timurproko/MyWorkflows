# Copy to .github/workflows/review-label-sweep.yml for optional manual historical recovery.
name: Sweep closed pull request review labels

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Remove managed review assignments from closed PRs (requires authorization)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    uses: timurproko/MyWorkflows/.github/workflows/review-label-sweep.yml@main
    with:
      apply: ${{ inputs.apply }}
    secrets:
      app_id: ${{ vars.DELIVERY_BOT_APP_ID }}
      app_private_key: ${{ secrets.DELIVERY_BOT_PRIVATE_KEY }}
